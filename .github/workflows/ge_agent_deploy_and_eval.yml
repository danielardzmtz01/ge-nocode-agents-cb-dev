# GitHub Actions to deploy and evaluate Gemini Enterprise No-Code Agents in-place (dev / stg / prd)

name: GE No-Code Agent Deploy & ADK Eval Actions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-and-evaluate:
    name: "GE No-Code Deploy & ADK Evaluate (${{ vars.ENV || 'dev' }})"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install google-adk & CLI dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Authenticate via Keyless Workload Identity Federation when WIF_PROVIDER is set
      - name: Authenticate to Google Cloud (WIF)
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup in-place environment variables (spec_variables.auto.yaml)
        id: spec_vars
        run: |-
          cat > spec_variables.auto.yaml <<EOF
          env: "${{ vars.ENV || 'dev' }}"
          ge_project_id: "${{ vars.GE_PROJECT_ID || 'sv-gob-ge-demo' }}"
          ge_location: "${{ vars.GE_LOCATION || 'global' }}"
          ge_engine_id: "${{ vars.GE_ENGINE_ID || 'sv-citizen-engine-demo' }}"
          ge_data_store_id: "${{ vars.GE_DATA_STORE_ID || 'sv-tramites-datastore-demo' }}"
          ge_agent_id: "${{ vars.GE_AGENT_ID || 'sv-citizen-assistant' }}"
          ge_sharing_scope: "${{ vars.GE_SHARING_SCOPE || 'PRIVATE' }}"
          EOF
          cat spec_variables.auto.yaml

      - name: Push & Deploy No-Code Agent to Gemini Enterprise (${{ vars.ENV || 'dev' }})
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "${{ vars.GE_PROJECT_ID }}" ] && [ -n "${{ vars.WIF_PROVIDER }}${GOOGLE_CREDENTIALS}" ]; then
            python cli/ge_agent_cli.py push \
              --vars-file spec_variables.auto.yaml \
              --template-path agents/sv_citizen_assistant/agent_template.json \
              --output-agent-id-file .resolved_agent_id
          else
            echo "Running in Demo/Showcase Mode (GE_PROJECT_ID / GCP Auth not set) -> Validating hydrated No-Code payload:"
            python cli/ge_agent_cli.py push \
              --vars-file spec_variables.auto.yaml \
              --template-path agents/sv_citizen_assistant/agent_template.json \
              --dry-run
            echo "${{ vars.GE_AGENT_ID || 'sv-citizen-assistant' }}" > .resolved_agent_id
          fi

      - name: Execute ADK Golden Dataset Evaluation Gate (${{ vars.ENV || 'dev' }})
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "${{ vars.GE_PROJECT_ID }}" ] && [ -n "${{ vars.WIF_PROVIDER }}${GOOGLE_CREDENTIALS}" ]; then
            python eval/run_eval.py \
              --vars-file spec_variables.auto.yaml \
              --agent-id-file .resolved_agent_id \
              --eval-set-path agents/sv_citizen_assistant/golden_dataset.evalset.json \
              --eval-config-path agents/sv_citizen_assistant/eval_config.json \
              --output-dir eval_results
          else
            python eval/run_eval.py \
              --vars-file spec_variables.auto.yaml \
              --agent-id-file .resolved_agent_id \
              --eval-set-path agents/sv_citizen_assistant/golden_dataset.evalset.json \
              --eval-config-path agents/sv_citizen_assistant/eval_config.json \
              --output-dir eval_results \
              --dry-run
          fi

      - name: Request HITL Agent Review (STG only)
        if: vars.ENV == 'stg' && github.event_name != 'pull_request'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "${{ vars.GE_PROJECT_ID }}" ] && [ -n "${{ vars.WIF_PROVIDER }}${GOOGLE_CREDENTIALS}" ]; then
            python cli/ge_agent_cli.py request-review \
              --vars-file spec_variables.auto.yaml \
              --agent-id "$(cat .resolved_agent_id)"
          else
            python cli/ge_agent_cli.py request-review \
              --vars-file spec_variables.auto.yaml \
              --agent-id "$(cat .resolved_agent_id)" \
              --dry-run
          fi

      - name: Create Immutable Revision & Publish No-Code Agent (PRD only)
        if: vars.ENV == 'prd' && github.event_name != 'pull_request'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "${{ vars.GE_PROJECT_ID }}" ] && [ -n "${{ vars.WIF_PROVIDER }}${GOOGLE_CREDENTIALS}" ]; then
            python cli/ge_agent_cli.py publish \
              --vars-file spec_variables.auto.yaml \
              --agent-id "$(cat .resolved_agent_id)" \
              --version-description "Automated PRD release from commit ${{ github.sha }}"
          else
            python cli/ge_agent_cli.py publish \
              --vars-file spec_variables.auto.yaml \
              --agent-id "$(cat .resolved_agent_id)" \
              --version-description "Automated PRD release from commit ${{ github.sha }}" \
              --dry-run
          fi

      - name: Upload ADK Evaluation Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adk-eval-report-${{ vars.ENV || 'dev' }}
          path: eval_results/
