# GitHub Actions to extract (DEV) or deploy (STG / PRD) Gemini Enterprise No-Code Agents and run ADK Eval

name: GE No-Code Agent Deploy & ADK Eval Actions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-and-evaluate:
    name: "GE No-Code Agent CI/CD & ADK Evaluate (${{ vars.ENV }})"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install google-adk & CLI dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Authenticate via Keyless Workload Identity Federation (WIF)
      - name: Authenticate to Google Cloud (Keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: "Resolve Environment Configuration (${{ vars.ENV }})"
        run: |
          cat > spec_variables.auto.yaml <<EOF
          env: "${{ vars.ENV || 'dev' }}"
          ge_project_id: "${{ vars.GE_PROJECT_ID }}"
          ge_location: "${{ vars.GE_LOCATION || 'global' }}"
          ge_engine_id: "${{ vars.GE_ENGINE_ID || 'sv-citizen-engine' }}"
          ge_data_store_id: "${{ vars.GE_DATA_STORE_ID || 'sv-tramites-datastore' }}"
          ge_agent_id: "${{ vars.GE_AGENT_ID }}"
          ge_sharing_scope: "${{ vars.GE_SHARING_SCOPE || 'PRIVATE' }}"
          EOF
          echo "=== Resolved Environment Variables (${{ vars.ENV }}) ==="
          cat spec_variables.auto.yaml

      - name: "Phase 1 (DEV Source): Extract & Parameterize Existing No-Code Agent from DEV (pull)"
        if: vars.ENV == 'dev'
        run: |
          python cli/ge_agent_cli.py pull \
            --vars-file spec_variables.auto.yaml \
            --template-path agents/sv_citizen_assistant/agent_template.json \
            --output-agent-id-file .resolved_agent_id

      - name: "Phase 1 (Target CD): Deploy No-Code Agent to Gemini Enterprise (${{ vars.ENV }})"
        if: vars.ENV != 'dev'
        run: |
          python cli/ge_agent_cli.py push \
            --vars-file spec_variables.auto.yaml \
            --template-path agents/sv_citizen_assistant/agent_template.json \
            --output-agent-id-file .resolved_agent_id

      - name: "Phase 2 (Quality Gate): Execute ADK Golden Dataset Evaluation (${{ vars.ENV }})"
        run: |
          python eval/run_eval.py \
            --vars-file spec_variables.auto.yaml \
            --agent-id-file .resolved_agent_id \
            --template-path agents/sv_citizen_assistant/agent_template.json \
            --corpus-path agents/sv_citizen_assistant/corpus/manual_oficial_tramites_sv.md \
            --eval-set-path agents/sv_citizen_assistant/golden_dataset.evalset.json \
            --eval-config-path agents/sv_citizen_assistant/eval_config.json \
            --output-dir eval_results

      - name: Request HITL Agent Review (STG only)
        if: vars.ENV == 'stg' && github.event_name != 'pull_request'
        run: |
          python cli/ge_agent_cli.py request-review \
            --vars-file spec_variables.auto.yaml \
            --agent-id "$(cat .resolved_agent_id)"

      - name: Create Immutable Revision & Publish No-Code Agent (PRD only)
        if: vars.ENV == 'prd' && github.event_name != 'pull_request'
        run: |
          python cli/ge_agent_cli.py publish \
            --vars-file spec_variables.auto.yaml \
            --agent-id "$(cat .resolved_agent_id)" \
            --version-description "Automated PRD release from commit ${{ github.sha }}"

      - name: Upload ADK Evaluation Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adk-eval-report-${{ vars.ENV || 'dev' }}
          path: eval_results/
